name: CI & Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test & Integration (Linux + Service Containers)
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
      vault:
        image: hashicorp/vault:latest
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: test-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Run unit tests
        run: zig build test

      - name: Wait for service containers
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8200/v1/sys/health > /dev/null; then
              echo "Vault is ready!"
              break
            fi
            sleep 1
          done
          for i in $(seq 1 30); do
            if curl -s http://localhost:4566/ > /dev/null; then
              echo "Floci is ready!"
              break
            fi
            sleep 1
          done

      - name: Seed test secrets & run live integration tests
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          VAULT_ADDR: http://localhost:8200
          VAULT_TOKEN: test-token
        run: |
          # Seed Floci SSM Parameter Store
          curl -s -X POST http://localhost:4566/ \
            -H "Content-Type: application/x-amz-json-1.1" \
            -H "X-Amz-Target: AmazonSSM.PutParameter" \
            -d '{"Name": "/ci/app/DB_USER", "Value": "postgres_ci", "Type": "String", "Overwrite": true}' || true

          # Seed HashiCorp Vault
          curl -s -X POST http://localhost:8200/v1/secret/data/ci \
            -H "X-Vault-Token: test-token" \
            -d '{"data": {"SECRET_KEY": "vault_ci_secret"}}'

          # Build local debug binary
          zig build

          # Test show command against live service containers
          ./zig-out/bin/zeller -c tests/integration_config.yml show --reveal

          # Test run command asserting both secrets injected
          ./zig-out/bin/zeller -c tests/integration_config.yml run -- sh -c '
            echo "Checking secrets injected from service containers..."
            test "$DB_USER" = "postgres_ci" || exit 1
            test "$SECRET_KEY" = "vault_ci_secret" || exit 1
            echo "All service container secrets verified!"
          '

  build:
    name: Build & Publish Multi-Target Binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Build Linux (x86_64)
        run: zig build linux -Doptimize=ReleaseSmall

      - name: Build Windows (x86_64)
        run: zig build windows -Doptimize=ReleaseSmall

      - name: Package Release Assets
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          cd zig-out/bin
          tar -czf zeller-linux-x86_64.tar.gz zeller-linux-x86_64
          zip zeller-windows-x86_64.zip zeller-windows-x86_64.exe
          sha256sum zeller-linux-x86_64 zeller-windows-x86_64.exe zeller-linux-x86_64.tar.gz zeller-windows-x86_64.zip > SHA256SUMS.txt

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeller-linux-x86_64
          path: zig-out/bin/zeller-linux-x86_64

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeller-windows-x86_64
          path: zig-out/bin/zeller-windows-x86_64.exe

      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zig-out/bin/zeller-linux-x86_64
            zig-out/bin/zeller-windows-x86_64.exe
            zig-out/bin/zeller-linux-x86_64.tar.gz
            zig-out/bin/zeller-windows-x86_64.zip
            zig-out/bin/SHA256SUMS.txt
          generate_release_notes: true

      - name: Publish Rolling Latest Pre-release (Master)
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Zeller Latest (Pre-release)"
          prerelease: true
          files: |
            zig-out/bin/zeller-linux-x86_64
            zig-out/bin/zeller-windows-x86_64.exe
            zig-out/bin/zeller-linux-x86_64.tar.gz
            zig-out/bin/zeller-windows-x86_64.zip
            zig-out/bin/SHA256SUMS.txt
