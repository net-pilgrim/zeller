name: CI & Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Run unit tests
        run: zig build test

  build:
    name: Build Multi-Target Binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Build Linux (x86_64)
        run: zig build linux -Doptimize=ReleaseSmall

      - name: Build Windows (x86_64)
        run: zig build windows -Doptimize=ReleaseSmall

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeller-linux-x86_64
          path: zig-out/bin/zeller-linux-x86_64

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeller-windows-x86_64
          path: zig-out/bin/zeller-windows-x86_64.exe
